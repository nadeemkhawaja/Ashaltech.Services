<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Ashaltech Services</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      background: #030712; color: #f1f5f9;
      font-family: 'Inter', system-ui, sans-serif; text-align: center; padding: 24px;
      background-image:
        radial-gradient(ellipse 60% 45% at 50% 0%, rgba(14, 165, 233, 0.09) 0%, transparent 60%),
        radial-gradient(ellipse 55% 45% at 50% 100%, rgba(3, 105, 161, 0.08) 0%, transparent 60%);
    }
    img { height: 88px; margin-bottom: 18px; filter: drop-shadow(0 0 14px rgba(14,165,233,0.25)); }
    .code { font-family: 'JetBrains Mono', monospace; color: #0ea5e9; font-size: 0.85rem; letter-spacing: 0.2em; }
    h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -0.02em; margin: 6px 0 10px; }
    p { color: #94a3b8; font-weight: 300; max-width: 440px; margin-bottom: 28px; }
    a.btn {
      display: inline-block; padding: 13px 30px; border-radius: 8px;
      background: #0ea5e9; color: #04121d; font-weight: 700; text-decoration: none;
      transition: all 0.3s ease;
    }
    a.btn:hover { background: #38bdf8; transform: translateY(-2px); }
  </style>
</head>
<body>
  <img src="/logo.svg" alt="Ashaltech logo" onerror="this.style.display='none'">
  <span class="code">ERROR 404</span>
  <h1>This route isn't in the fabric</h1>
  <p>The page you're looking for doesn't exist or has been moved. Let's get you back to a known-good path.</p>
  <a class="btn" href="/">Back to Home</a>
</body>
</html>

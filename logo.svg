    <line x1="176" y1="335" x2="202" y2="335"/><circle cx="209" cy="335" r="4.5" stroke="none"/>
    <line x1="198" y1="349" x2="224" y2="349"/><circle cx="191" cy="349" r="4.5" stroke="none"/>
    <line x1="288" y1="335" x2="314" y2="335"/><circle cx="321" cy="335" r="4.5" stroke="none"/>
    <line x1="310" y1="349" x2="336" y2="349"/><circle cx="303" cy="349" r="4.5" stroke="none"/>
